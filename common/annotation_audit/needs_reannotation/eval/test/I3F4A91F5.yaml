known_issues:
- id: offset_drift
  scope: P000027, P000083, P000144, P000242, P000269 (test split)
  detail: Tsawa span start/end offsets drift 30-113 chars (median) from the nearest line-break / shad
    boundary. The recent annotator review pass did not fix this; verified byte-for-byte against the raw
    Tsawa.yml.
- id: tsawa_vs_quotation
  scope: all splits, frequency unknown, not yet systematically counted
  detail: No documented convention for telling genuine root-text (tsawa) from a quoted/cited verse attributed
    to a named source or chapter (e.g. verses closed with zhes/ces-type markers that are preceded by a
    named-source or chapter citation, like "in the fourth chapter [it says]"). Some currently-annotated
    tsawa spans look like quotations under this test and vice versa.
- id: multi_span_paragraphs
  scope: all splits, frequency unknown, not yet systematically counted
  detail: Some paragraphs contain 2+ separate tsawa quotes with non-tsawa text between them inside what
    is annotated as a single span (or a span that should be split). The current schema (one span = one
    card) and review tooling can't represent this without annotator judgment on where to split.
