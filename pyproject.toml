[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibetan-layer-detection"
version = "0.1.0"
description = "Detect Tsawa, Sabche, Chapter, Quotation and Yigchung layers in Tibetan text with per-layer mmBERT models."
requires-python = ">=3.9"
dependencies = [
    "transformers",
    "torch",
    "pyyaml",
    # numpy is a direct import in decode.py/infer.py; not in the original
    # dependency list this was specced with, added because pip install .
    # would otherwise succeed while actually running the code could still
    # fail with ModuleNotFoundError on an environment where torch alone
    # didn't happen to pull numpy in.
    "numpy",
]

[project.scripts]
tibetan-preprocess = "detect.preprocess:main"
tibetan-infer = "detect.infer:main"
tibetan-postprocess = "detect.postprocess:main"
tibetan-detect = "detect.detect_layers:main"

[tool.setuptools]
packages = ["detect"]
